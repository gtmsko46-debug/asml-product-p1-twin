[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asml_product_p1_twin"
version = "0.1.0"
description = "Champion-facing FEL↔scanner digital twin — importable product surface for research pods (M1)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Twin PI / gtmsko46-debug" }]
keywords = ["asml", "fel", "scanner", "digital-twin", "lithography"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["asml_product_p1_twin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
